<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- header Start -->
    <header>
      <nav>
        <div class="navbar-container">
          <h1 class="nav-logo">LOGO</h1>
          <button class="default-button">Sign Up</button>
        </div>

        <div class="hero-section">
          <h1 class="hero-title">
            Cool Dark UI Template for Webflow Agencies!
          </h1>
          <button class="default-button adjustment-button">Stay Focused</button>
        </div>
      </nav>
    </header>
    <!-- header END -->

    <!-- Main START -->
    <main>
        <!-- Action Section  -->
        <section>
            <div class="web-conf">
               <div>
                 <h2 class="web-conf-header">See It in Action</h2>
                <p class="web-conf-desc">Explore the live preview and imagine your brand in this bold new look.</p>
                <button class="default-button">Launch Live Preview</button>
               </div>
               <img class="web-conf-img" src="./Assets/wc-mini.png" alt="" srcset="">
            </div>
        </section>
        <!-- Action Section  -->

        <section class="productive-users-section">
            <div class="productive-users">
                <h1 class="productive-users-header">Joined Thousands of Productive Users</h1>
                <div class="productive-users-info">
                    <div>
                        <h1>50K</h1>
                        <p>Active Users</p>
                    </div>
                    <div>
                        <h1>2M+</h1>
                        <p>Focus Sessions</p>
                    </div>
                    <div>
                        <h1>95%</h1>
                        <p>Satisfaction Rate</p>
                    </div>
                </div>
            </div>
        </section>


    </main>
    <!-- Main END -->

    <!-- Footer Start -->
    <footer></footer>
    <!-- Footer END -->
  </body>
</html>
